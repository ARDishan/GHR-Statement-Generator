name: Build standalone app

on:
  workflow_dispatch:   # adds a manual "Run workflow" button
  push:
    tags:
      - "v*"            # also auto-builds when you push a version tag

jobs:
  build:
    strategy:
      fail-fast: false   # let all 3 OS builds finish even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: >
          pyinstaller --onefile --name PaymentScheduleApp
          --add-data "app_streamlit.py${{ matrix.os == 'windows-latest' && ';' || ':' }}."
          --add-data "core.py${{ matrix.os == 'windows-latest' && ';' || ':' }}."
          --add-data "assets${{ matrix.os == 'windows-latest' && ';' || ':' }}assets"
          --collect-all streamlit
          launcher.py

      - name: Build binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          pyinstaller --onefile --name PaymentScheduleApp
          --add-data "app_streamlit.py:."
          --add-data "core.py:."
          --add-data "assets:assets"
          --collect-all streamlit
          launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaymentScheduleApp-${{ matrix.os }}
          path: dist/*